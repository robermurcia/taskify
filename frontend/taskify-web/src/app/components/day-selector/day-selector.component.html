<section aria-label="Calendario de tareas">
    <div class="calendar-heading"><span>{{ month }}</span><div class="calendar-actions">
        <button class="button subtle" (click)="selectDate.emit(today)">Hoy</button>
        <button class="icon-button" aria-label="14 días anteriores" (click)="move(-14)"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6" /></svg></button>
        <button class="icon-button" aria-label="14 días siguientes" (click)="move(14)"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6" /></svg></button>
    </div></div>
    <div class="days" #dayStrip>
        @for (day of days; track day.date) {
            <button class="day" [class.selected]="selected === day.date" [class.today]="day.date === today"
                [attr.aria-pressed]="selected === day.date" [attr.aria-current]="day.date === today ? 'date' : null"
                [attr.aria-label]="day.label + ', ' + (counts[day.date] || 0) + ' tareas'" (click)="selectDate.emit(day.date)">
                <span>{{ day.weekday }}</span><strong>{{ day.number }}</strong>
                <small>{{ counts[day.date] || '·' }}</small>
            </button>
        }
    </div>
</section>
