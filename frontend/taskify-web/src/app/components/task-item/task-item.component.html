<article [class.completed]="task.completed" [attr.aria-busy]="busy">
    <input type="checkbox" class="task-checkbox" [checked]="task.completed" [disabled]="busy" (change)="requestToggle($event)"
        [attr.aria-label]="(task.completed ? 'Marcar pendiente: ' : 'Completar: ') + task.title + (recurrence ? ' (toda la serie)' : '')">
    <div class="content"><h3>{{ task.title }}</h3>
        @if (task.description) { <p class="description">{{ task.description }}</p> }
        <div class="metadata"><span class="priority" [class.high]="task.priority === 'HIGH'" [class.low]="task.priority === 'LOW'">{{ priorityLabels[task.priority] }}</span>
            @if (recurrence) { <span class="repeat" [title]="recurrence + '. El estado de completada se aplica a toda la serie.'"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3" /></svg>{{ recurrence }}</span> }
            @if (task.completed) { <span>Completada</span> }
        </div>
    </div>
    <div class="actions">
        <button class="icon-button" [disabled]="busy" [attr.aria-label]="'Editar: ' + task.title" (click)="edit.emit()"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m16 3 5 5-12 12-6 1 1-6ZM14 5l5 5" /></svg></button>
        <button class="icon-button remove" [disabled]="busy" [attr.aria-label]="'Eliminar: ' + task.title" (click)="remove.emit()"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7" /></svg></button>
    </div>
</article>
