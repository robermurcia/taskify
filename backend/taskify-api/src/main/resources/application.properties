spring.application.name=Taskify API

# Render injects PORT; local development continues to use 8080.
server.port=${PORT:8080}
server.address=0.0.0.0
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# URI de conexión a MongoDB
spring.data.mongodb.uri=${MONGO_URI}

# Clave secreta usada para firmar los tokens JWT y su duración
jwt.secret=${SECRET_KEY:}
jwt.expiration=86400000

# Documentation is opt-in, including its public routes.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
